<!--
  スクリーンショットを原寸で見られるようにする。
  jekyll-theme-minimal は本文を狭い段に収めるため、UIの細部が読めない。
  画像をクリックすると全画面のオーバーレイで開く。

  依存ライブラリは使わない（GitHub Pages のビルドに何も足さないため）。
-->
<style>
  /* 本文中の画像は「押せる」ことが分かる見た目にする */
  section img {
    max-width: 100%;
    /* 端末ページのサンプル（480x800 など縦長）は、幅に合わせると画面を
       占領して読み進めにくい。高さで頭打ちにすると、縦長のものだけが
       縮み、横長のUIスクリーンショットは影響を受けない。
       原寸はクリックで開ける。 */
    max-height: 44vh;
    width: auto;
    height: auto;
    border: 1px solid #d8dde2;
    border-radius: 4px;
    cursor: zoom-in;
    background: #fff;
  }
  section img:hover { border-color: #a8b4c0; }

  #shot-overlay {
    position: fixed;
    inset: 0;
    background: rgba(16, 20, 24, 0.92);
    display: none;
    z-index: 9999;
    cursor: zoom-out;
    overflow: auto;
    padding: 24px;
    box-sizing: border-box;
  }
  #shot-overlay.open { display: block; }
  #shot-overlay img {
    display: block;
    margin: 0 auto;
    max-width: none;      /* 原寸で見せる。狭ければ横スクロールで追える */
    border: none;
    border-radius: 2px;
    background: #fff;
    cursor: zoom-out;
  }
  #shot-overlay .shot-hint {
    position: fixed;
    top: 12px;
    right: 16px;
    color: #e9edf1;
    font: 13px/1.6 -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: rgba(0, 0, 0, 0.45);
    padding: 4px 10px;
    border-radius: 4px;
    pointer-events: none;
  }
  @media print { #shot-overlay { display: none !important; } }
</style>

<script>
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.id = 'shot-overlay';
    var full = document.createElement('img');
    var hint = document.createElement('div');
    hint.className = 'shot-hint';
    hint.textContent = 'クリックまたは Esc で閉じる';
    overlay.appendChild(full);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);

    function open(src, alt) {
      full.src = src;
      full.alt = alt || '';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      full.removeAttribute('src');
    }

    var images = document.querySelectorAll('section img');
    for (var i = 0; i < images.length; i++) {
      (function (img) {
        img.addEventListener('click', function () { open(img.src, img.alt); });
      })(images[i]);
    }
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { close(); }
    });
  });
})();
</script>

<!--
  左段（見出しと脚注のあいだ）に、実際の変換結果を小さく置く。

  jekyll-theme-minimal の左段は header と footer が上下に固定されるだけで、
  そのあいだが広く空く。テーマの layout を丸ごと上書きすると更新に追随
  できなくなるため、header の末尾へ差し込む形にしてある。
-->
<style>
  #sidebar-sample { margin: 24px 0 0; }
  #sidebar-sample a { display: block; border: 0; }
  #sidebar-sample img {
    display: block;
    transition: opacity 0.12s ease-in-out;
    width: 100%;
    max-width: 248px;
    max-height: 34vh;
    height: auto;
    border: 0;
    background: none;
  }
  #sidebar-sample a:hover img { opacity: 0.82; }
  #sidebar-sample .caption {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: #7a8288;
  }
  /* 幅の狭い画面では左段が本文の上へ回り込む。そこへ画像を挟むと本文が
     遠ざかるだけなので出さない。 */
  @media print, screen and (max-width: 960px) {
    #sidebar-sample { display: none; }
  }
</style>
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var header = document.querySelector('.wrapper > header') || document.querySelector('header');
    if (!header || document.getElementById('sidebar-sample')) { return; }

    var box = document.createElement('div');
    box.id = 'sidebar-sample';

    // 画像はサンプル集への入口も兼ねる。サイドバーは全ページに出るので、
    // 相対パスではなくサイト基準の絶対パスを使う。
    var link = document.createElement('a');
    link.href = '{{ "/docs/19-samples.html" | relative_url }}';
    link.title = '変換後サンプル集を見る';

    var img = document.createElement('img');
    img.src = '{{ "/images/sidebar-pages.png" | relative_url }}';
    img.alt = '縦書きで変換したページを3枚重ねた画像';
    img.setAttribute('loading', 'lazy');
    link.appendChild(img);
    box.appendChild(link);

    var caption = document.createElement('p');
    caption.className = 'caption';
    caption.textContent = '変換したページの例';
    box.appendChild(caption);

    header.appendChild(box);
  });
})();
</script>
